name: Build DRM_Leveler SILVER (Windows VST3)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DRM_Leveler_SILVER-VST3-Windows
          path: build/DRMLevelerSILVER_artefacts/Release/VST3/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: DRM_Leveler_SILVER-Standalone-Windows
          path: build/DRMLevelerSILVER_artefacts/Release/Standalone/
